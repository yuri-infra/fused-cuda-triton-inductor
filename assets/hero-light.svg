      <circle cx="0" cy="0" r="0.9" fill="#263244" fill-opacity="0.45"/>
    </pattern>
    <radialGradient id="rad-dark-emerald" cx="82%" cy="32%" r="48%">
      <stop offset="0%" stop-color="#10f5a0" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#10f5a0" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow-dark-emerald" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.0" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
